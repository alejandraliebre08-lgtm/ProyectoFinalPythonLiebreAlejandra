{% extends "tienda/inicio.html" %}
{% load static %}

{% block contenidoQueCambia %}
<div class="container mt-4">
  <h1>Nuevo Cliente</h1>

  {% if form.errors %}
    <div class="alert alert-danger">
      Revisá los datos ingresados
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
  </form>
</div>
{% endblock %}
